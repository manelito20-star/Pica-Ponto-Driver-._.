<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PicaPonto Driver TVDE - Oficial</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; max-width: 450px; }
        h1 { color: #333; margin-bottom: 5px; }
        .subtitulo { color: #666; font-size: 14px; margin-bottom: 25px; }
        .seccao-pagamento { border-top: 1px solid #eee; padding-top: 10px; }
        input[type="tel"] { width: 70%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 50px; text-align: center; font-size: 16px; }
        .btn-pagar { background-color: #0070ba; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 75%; }
        .btn-pagar:hover { background-color: #005ea6; }
        .status { margin-top: 20px; font-weight: bold; color: #666; }
        .info-campanha { font-size: 12px; color: #777; margin-top: 20px; line-height: 1.4; border-top: 1px dashed #ddd; padding-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>PicaPonto Driver TVDE</h1>
        <div class="subtitulo">Adquira a sua licença vitalícia oficial</div>
        
        <div class="seccao-pagamento">
            <p>Insira o seu número telemóvel associado ao MB WAY para efetuar o pagamento de <span id="preco_dinamico" style="font-weight: bold; color: #0070ba;">...</span> e receber o link de download.</p>
            
            <input type="tel" id="mbway_phone" placeholder="9xxxxxxxx" maxlength="9">
            <br>
            <button class="btn-pagar" onclick="iniciarPagamento()">Pagar com MB WAY</button>
            
            <div id="status_mensagem" class="status"></div>

            <div class="info-campanha">
                <strong>Tabela de Preços (Campanha Lançamento):</strong><br>
                Até dia 15 de novembro 2026: 1€<br>
                Até ao final do ano 2026: 3€<br>
                Em 2027: 5€
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // CONFIGURAÇÃO DE DATAS E CHAVES DA GATEWAY
        // =========================================================================
        const DATA_FIM_FASE1 = new Date(2026, 10, 15, 23, 59, 59); // 15 de Nov 2026
        const DATA_FIM_FASE2 = new Date(2026, 11, 31, 23, 59, 59); // 31 de Dez 2026

        const CHAVE_1_EURO  = "SUA_CHAVE_FASE_1_EURO";
        const CHAVE_3_EUROS = "SUA_CHAVE_FASE_3_EUROS";
        const CHAVE_5_EUROS = "SUA_CHAVE_FASE_5_EUROS";

        let API_KEY_ATIVA;
        let VALOR_APP;

        const dataAtual = new Date();

        if (dataAtual <= DATA_FIM_FASE1) {
            API_KEY_ATIVA = CHAVE_1_EURO;
            VALOR_APP = "1.00";
        } else if (dataAtual <= DATA_FIM_FASE2) {
            API_KEY_ATIVA = CHAVE_3_EUROS;
            VALOR_APP = "3.00";
        } else {
            API_KEY_ATIVA = CHAVE_5_EUROS;
            VALOR_APP = "5.00";
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("preco_dinamico").innerText = VALOR_APP + "€";
        });

        // =========================================================================
        // FUNÇÕES DE COMUNICAÇÃO COM O MB WAY
        // =========================================================================
        async function iniciarPagamento() {
            const phone = document.getElementById('mbway_phone').value;
            const statusDiv = document.getElementById('status_mensagem');

            if (phone.length !== 9 || !phone.startsWith('9')) {
                statusDiv.innerText = "Por favor, introduza um número MB WAY válido.";
                statusDiv.style.color = "red";
                return;
            }

            statusDiv.innerText = `A enviar notificação de ${VALOR_APP}€ para o seu MB WAY... Aceite na App.`;
            statusDiv.style.color = "#0070ba";

            try {
                let resposta = await fetch(`https://gateway.pt{API_KEY_ATIVA}&telemovel=${phone}&valor=${VALOR_APP}`);
                let dados = await resposta.json();

                if (dados.sucesso) {
                    verificarEstadoPagamento(dados.id_transacao);
                } else {
                    statusDiv.innerText = "Erro ao processar o MB WAY. Tente novamente.";
                    statusDiv.style.color = "red";
                }
            } catch (erro) {
                statusDiv.innerText = "Erro de ligação. Tente mais tarde.";
                statusDiv.style.color = "red";
            }
        }

        async function verificarEstadoPagamento(idTransacao) {
            const statusDiv = document.getElementById('status_mensagem');
            
            let intervalo = setInterval(async () => {
                try {
                    let resposta = await fetch(`https://gateway.pt{API_KEY_ATIVA}&id=${idTransacao}`);
                    let dados = await resposta.json();

                    if (dados.estado === "PAGO") {
                        clearInterval(intervalo);
                        // O DOWNLOAD E O CÓDIGO SÓ SÃO REVELADOS AQUI APÓS A CONFIRMAÇÃO DO BANCO
                        statusDiv.innerHTML = `
                            <div style="background-color: #e6f4ea; border: 1px solid #137333; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: left;">
                                <p style="color: #137333; font-weight: bold; margin-top: 0; font-size: 16px;">✔ Pagamento Confirmado com Sucesso!</p>
                                
                                <p style="margin-bottom: 15px;"><strong>Passo 1:</strong> Clique no botão abaixo para descarregar a aplicação:</p>
                                <a href="https://google.com" target="_blank" style="background-color: #28a745; color: white; border: none; padding: 12px 25px; font-size: 14px; border-radius: 50px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-bottom: 15px; text-align: center; width: 80%;">Descarregar PicaPonto APK</a>
                                
                                <p style="margin-bottom: 5px;"><strong>Passo 2:</strong> Use este código de ativação para desbloquear a app após instalar:</p>
                                <h2 style="background: white; padding: 8px; border: 1px dashed #333; display: inline-block; letter-spacing: 2px; margin: 5px 0;">AppSuperSegura2026</h2>
                            </div>
                        `;
                    } else if (dados.estado === "RECUSADO" || dados.estado === "EXPIRADO") {
                        clearInterval(intervalo);
                        statusDiv.innerText = "Pagamento recusado ou expirado no MB WAY.";
                        statusDiv.style.color = "red";
                    }
                } catch (e) {
                    // Continua a verificar em caso de erro de rede
                }
            }, 3000);
        }
    </script>
</body>
</html>
